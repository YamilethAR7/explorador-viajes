<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Explorador de Vajes</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- v0.5.0 LAEFLET CSS-->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />

    <!-- v0.5.0 LEAFLET JAVASCRIPT-->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""></script>
  </head>

  <body class="bg-slate-50 text-slate-800 min-h-screen">
    <header class="bg-white border-b border-slate-200 shadow-sm">
      <div
        class="max-w-7xl mx-auto px-6 py-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <h1 class="text-2x1 font-bold text-blue-600">
            🌎 Explorador de Viajes
          </h1>
          <p class="text-sm text-slate-500">
            Descubre destinos alrededor del mundo
          </p>
        </div>

        <nav class="flex gap-2">
          <button
            id="btn-explorar"
            type="button"
            class="px-4 py-2 bg-blue-600 text-white rounded-lg font-medium cursor-pointer hover:bg-blue-700 transition">
            Explorar
          </button>

          <button
            id="btn-favoritos"
            type="button"
            class="px-4 py-2 bg-white text-slate-700 border border-slate-300 rounded-lg font-medium cursor-pointer hover:bg-slate-100 transition">
            ♥ Favoritos
          </button>
        </nav>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">
      <!-- PRESENTACIÓN DEL EXPLORADOR-->
      <section class="mb-10">
        <h2 class="text-3xl md:text-4xl font-bold text-slate-900 mb-3">
          Descubre tu proximo destino
        </h2>

        <p class="text-slate-500 max-w-2xl">
          Explora países de todo el mundo, consulta información relevante y
          guarda tus destinos favoritos
        </p>
      </section>

      <section
        class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-10">
        <form
          id="search-form"
          class="grid grid-cols-1 md:grid-cols-4 gap-5 items-end">
          <div class="md:col-span-2">
            <label
              for="search-input"
              class="block text-sm font-medium text-slate-700 mb-2"
              >Buscar destino</label
            >
            <input
              type="text"
              id="search-input"
              placeholder="Ej. Mexico, Japon, Italia"
              class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
          </div>

          <!-- FILTRO POR CONTINENTE -->

          <div>
            <label
              for="continent-filter"
              class="blcok text-sm font-medium text-slate-700 mb-2"
              >Continente</label
            >
            <select
              id="continent-filter"
              class="w-full px-4 py-3 border border-slate-300 rounded-lg bg-white outline-none focus:ring-2 focus:ring-blue-500">
              <option value="all">Todos</option>
              <option value="Africa">África</option>
              <option value="Americas">America</option>
              <option value="Asia">Asia</option>
              <option value="Europe">Europa</option>
              <option value="Oceania">Oceania</option>
            </select>
          </div>

          <!--ORDENAMIENTO-->
          <div>
            <label
              for="sort-filter"
              class="block text-sm font-medium text-slate-700 mb-2"
              >Ordenar
            </label>

            <select
              id="sort-filter"
              class="w-full px-4 py-3 bor
