
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Explorador de Viajes</title>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen">

    <header class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto p-6 flex flex-wrap justify-between items-center gap-4">

            <div>
                <h1 class="text-3xl font-bold text-blue-700">
                    🌎 Explorador de Viajes
                </h1>
                <p class="text-slate-500">
                    Descubre tu próximo destino
                </p>
            </div>

            <nav class="flex gap-3">
                <button id="btn-explorar"
                    class="bg-blue-600 text-white px-5 py-3 rounded-lg cursor-pointer">
                    Explorar
                </button>

                <button id="btn-favoritos"
                    class="border px-5 py-3 rounded-lg cursor-pointer">
                    ♥ Favoritos
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-10">

        <h2 class="text-3xl font-bold mb-3">
            Explora países del mundo
        </h2>

        <p class="text-slate-500 mb-8">
            Busca, filtra y guarda tus destinos favoritos.
        </p>

        <!-- Formulario -->
        <form id="search-form"
              class="bg-white rounded-xl shadow-sm p-6 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">

            <div>
                <label for="search-input" class="block mb-2">
                    Buscar país
                </label>
                <input id="search-input"
                       type="text"
                       placeholder="México, Japón, Brasil..."
                       class="w-full border rounded-lg p-3">
            </div>

            <div>
                <label for="continent-filter" class="block mb-2">
                    Continente
                </label>
                <select id="continent-filter"
                        class="w-full border rounded-lg p-3">
                    <option value="all">Todos</option>
                    <option value="Africa">África</option>
                    <option value="Americas">América</option>
                    <option value="Asia">Asia</option>
                    <option value="Europe">Europa</option>
                    <option value="Oceania">Oceanía</option>
                </select>
            </div>

            <div>
                <label for="sort-filter" class="block mb-2">
                    Ordenar por
                </label>
                <select id="sort-filter"
                        class="w-full border rounded-lg p-3">
                    <option value="az">Nombre A-Z</option>
                    <option value="za">Nombre Z-A</option>
                    <option value="population-desc">
                        Mayor población
                    </option>
                    <option value="population-asc">
                        Menor población
                    </option>
                </select>
            </div>

            <button type="submit"
                    class="md:col-span-3 bg-blue-600 text-white p-3 rounded-lg cursor-pointer">
                Buscar destinos
            </button>
        </form>

        <!-- Resultados -->
        <section>
            <div class="flex justify-between items-center mb-6">
                <h2 id="section-title" class="text-2xl font-bold">
                    Destinos
                </h2>

                <p id="results-count" class="text-slate-500">
                    0 destinos
                </p>
            </div>

            <p id="initial-message"
               class="text-center text-slate-500 mb-5">
            </p>

            <div id="destinations-container"
                 class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
        </section>
    </main>

    <!-- Modal de detalles -->
    <div id="detail-modal"
         class="hidden fixed inset-0 z-50 bg-black/60 overflow-y-auto p-4">

        <div class="bg-white max-w-2xl mx-auto my-10 p-6 rounded-xl">

            <button id="close-modal"
                    type="button"
                    class="float-right text-3xl cursor-pointer"
                    aria-label="Cerrar">
                ×
            </button>

            <div id="detail-content"></div>

            <div id="country-map"
                 class="h-64 mt-5 rounded-lg">
            </div>
        </div>
    </div>

    <!-- Ruta adaptada a tus carpetas -->
    <script type="module" src="./js/app.js"></script>
</body>
</html>
